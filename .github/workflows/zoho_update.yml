name: Update Zoho CRM Leads

on:
  schedule:
    - cron: '0 12 9 6 *'    # 9 June 5:30 PM IST (12:00 UTC) - TEST 10 leads
    - cron: '30 5 10 6 *'    # 10 June 11:00 AM IST (5:30 UTC) - 2000 leads
    - cron: '30 4 11 6 *'    # 11 June 10:00 AM IST (4:30 UTC) - 2000 leads
    - cron: '30 4 12 6 *'    # 12 June 10:00 AM IST (4:30 UTC) - 2000 leads
  workflow_dispatch:           # Manual run button

jobs:
  update-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests

      - name: Run Lead Update Script
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: python update_leads.py
