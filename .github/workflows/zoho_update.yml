name: Update Zoho CRM Leads

on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 10 6 *'   # 10 June 7:25 UTC - 2,000 leads
    - cron: '30 5 11 6 *'   # 11 June 5:30 UTC - 2,000 leads
    - cron: '30 5 12 6 *'   # 12 June 5:30 UTC - 2,000 leads

jobs:
  update-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests

      - name: Run Lead Update Script
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: python update_leads.py
